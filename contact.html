<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტაქტი - ტელეფონის და კომპიუტერების აქსესუარები</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <meta name="description"
        content="დაგვიკავშირდით ტელეფონის და კომპიუტერის აქსესუარების შესახებ. კითხვები დამტენებზე, ქეისებზე და სხვა აქსესუარებზე.">
    <meta name="keywords"
        content="კონტაქტი, ტელეფონის აქსესუარები, phone accessories contact, დამტენი, ტელეფონის ქეისი">
    <meta name="author" content="ტელეფონის და კომპიუტერის აქსესუარები">

    <meta name="robots" content="index, follow">

    <!-- Social Media SEO -->
    <meta property="og:title" content="კონტაქტი | ტელეფონის და კომპიუტერის აქსესუარები">
    <meta property="og:description" content="დაგვიკავშირდით ნებისმიერი შეკითხვით ტელეფონის აქსესუარებზე.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yoursite.ge/contact.html">
    <meta property="og:image" content="https://yoursite.ge/images/contact.jpg">
</head>

<body>
    <header>
        <nav>
            <div class="logo">აქსესუარები</div>
            <ul>
                <li><a href="index.html">მთავარი</a></li>
                <li><a href="contact.html">კონტაქტი</a></li>
            </ul>
        </nav>
        <div class="hero">
            <h1>კონტაქტი</h1>
            <p>დაგვიკავშირდით ნებისმიერი შეკითხვით</p>
        </div>
    </header>
    <main>
        <section id="contact-form">
            <h2>დაგვიკავშირდით</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">სახელი</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">ელ. ფოსტა</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">შეტყობინება</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">გაგზავნა</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 ტელეფონის და კომპიუტერების აქსესუარები. ყველა უფლება დაცულია.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
